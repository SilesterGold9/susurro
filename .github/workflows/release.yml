name: release

# First real signed release: v0.1.0. Tag push (v*) builds the Tauri app
# (AppImage/.deb on Linux; MSI once v0.6.0 lands), signs the updater
# bundles, publishes latest.json, then attaches the CLI binaries.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tauri:
    name: tauri app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
          - os: windows-latest
            args: "--bundles msi,nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config cmake clang libclang-dev
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: |
          winget install -e --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json
      - name: frontend
        working-directory: app-tauri
        run: npm ci && npm run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Susurro ${{ github.ref_name }}"
          releaseBody: |
            Talk-to-text that works even when the internet does not.

            What's inside
            - Local STT by default (whisper.cpp on CPU, iGPU encoder where OpenVINO is present), optional cloud when online.
            - First-run benchmark picks the model tier; stt-bench races backends with winner default.
            - Windows port: Win+Shift+R hotkey, SendInput paste, MSI plus NSIS installers.
            - Pill overlay with live waveform, staged progress, and sound cues.
            - SQLite history, persistent tickets, custom dictionary, fail-open cleanup.
            - See the milestone changelog and open issues on the repo for scope.

            Assets
            - Linux: AppImage and .deb. Windows: MSI plus NSIS setup. Standalone CLI: susurro (Linux) and susurro.exe (Windows).
            - latest.json powers the in-app updater. Settings checks quietly and never forces a modal.

            Install
            - Linux: run the AppImage or install the .deb, then install wl-copy, ydotool with ydotoold running, and socat for paste. The speech model downloads itself on first run.
            - Windows: run the MSI or the setup, then use Win+Shift+R to dictate. Nothing else to install.
            - Run susurro doctor to verify mic, tools, model, and updater reachability.

            Verify
            - cargo fmt --all -- --check, cargo clippy --workspace --all-targets -- -D warnings, cargo test --workspace.
            - cargo run -p susurro-cli -- doctor plus listen --mock --stdout for a hardware-free proof.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
          projectPath: app-tauri
          args: ${{ matrix.args }}

  cli:
    name: cli binaries
    needs: [tauri]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake clang libclang-dev
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: |
          winget install -e --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p susurro-cli
      - name: upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            gh release upload "$TAG" target/release/susurro.exe --clobber
          else
            gh release upload "$TAG" target/release/susurro --clobber
          fi
