name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p susurro-cli
      # v0.1.0+: sign binaries, publish AppImage/.deb + MSI,
      # generate latest.json updater manifest, GitHub Release.
      # Skeleton only in v0.0.1 — proves the trigger works.
      - name: package stub
        run: echo "release skeleton — real packaging lands in v0.1.0/v0.6.0"
