name: ci

on:
  push:
  pull_request:

# Rapid pushes cancel superseded runs: each push today queued a full
# 5-minute matrix behind the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install audio deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake clang libclang-dev
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: |
          winget install -e --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Dependency compilation dominates this job (reqwest, keyring,
      # cpal); the cache turns repeat pushes incremental.
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  tauri-check:
    name: tauri check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config cmake clang libclang-dev
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: |
          winget install -e --id LLVM.LLVM --silent --accept-source-agreements --accept-package-agreements
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Separate workspace (excluded from the root one) with its own
      # lockfile: cache it explicitly or every run rebuilds tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json
      - name: frontend build
        working-directory: app-tauri
        run: npm ci && npm run build
      - name: backend clippy
        working-directory: app-tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings
