[workspace]
members = [
  "core",
  "adapters-audio",
  "adapters-stt-local",
  "adapters-stt-cloud",
  "adapters-cleanup",
  "adapters-linux",
  "adapters-windows",
  "storage",
  "cli",
  "contracts",
]
# Tauri app builds standalone (needs GTK/WebKit; CI covers it separately).
exclude = ["app-tauri/src-tauri"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["Silvestre Dourado"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
sha2 = "0.11"
susurro-core = { path = "core" }
