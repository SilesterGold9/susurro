[workspace]
members = [
  "core",
  "adapters-audio",
  "adapters-stt-local",
  "adapters-stt-cloud",
  "adapters-cleanup",
  "adapters-linux",
  "adapters-windows",
  "storage",
  "cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Silvestre Dourado"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
susurro-core = { path = "core" }
